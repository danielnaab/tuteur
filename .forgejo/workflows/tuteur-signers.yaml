# managed by tuteur: https://github.com/danielnaab/tuteur (delete this line to keep your own edits)
# tuteur's signer check, report-only: who signed each commit a push brings to the default branch, and each
# tag, against the repo's .forgejo/allowed_signers (principals daniel@person, daniel@routine, agent@HOST).
# An agent's signature needs a Pot-Run: trailer; grants, the signers file and agent instructions need a
# @person key; a tag needs @person or @routine. It never fails: findings are warnings in the job's log.
# Copy to .forgejo/workflows/. The step itself is `nix run .#tuteur ci signers` (tuteur's lib/ci.sh)
# at the tuteur version the repo pins, and `tuteur upgrade` replaces this file with the copy each new
# version ships, as long as the line above is here.
name: tuteur-signers
on:
  push:
    branches: [main]
    tags: ["*"]

concurrency:
  group: tuteur-signers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signers:
    # Any runner with Nix, as tuteur-check's.
    runs-on: nixos-latest
    timeout-minutes: 20
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
    steps:
      - name: Checkout, with the pushed ref's history
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "$REPO_URL.git"
          auth="http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "$auth" fetch -q --no-tags origin "+$REF:$REF"
          # the signers file a tag or a new branch is checked against: the default branch's
          if [ -n "$DEFAULT" ]; then git -c "$auth" fetch -q --no-tags origin "+refs/heads/$DEFAULT:refs/tuteur/signers" || true; fi
          # a force-push's old commit is not in the new history: fetch it too, when the forge still has it
          case $BEFORE in ""|0000000000000000000000000000000000000000) ;;
            *) git -c "$auth" fetch -q --no-tags origin "$BEFORE" 2>/dev/null || true ;; esac
          git checkout -q --force --detach "$SHA"

      - name: Signers (report-only)
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.ref }}
          SIGNERS_REF: refs/tuteur/signers
        run: |
          # tuteur's flake, found as tuteur-check finds it
          rs=$(git grep -l -F -e '<!-- managed by tuteur: https://github.com/danielnaab/tuteur -->' -e '<!-- managed by graft: https://github.com/danielnaab/graft -->' -- '*/README.md' || true)
          case $rs in *$'\n'*) echo "::warning::two patterns folders:" $rs; exit 0 ;; esac
          sd=${rs%/README.md} fd=. flake=.
          if [[ $sd == */* ]]; then fd=${sd%/*}; fi
          if [ "$fd" != . ]; then
            flake=path:$PWD/$fd
            git submodule update -q --init --recursive -- "$sd"
          fi
          nix run "$flake#tuteur" ci signers || echo "::warning::tuteur signers did not run (above)"
