apiVersion: kb/v1
name: tuteur
description: "tuteur: tuteur other repositories as git submodules at release tags, and wire what they ship into a Nix flake"

entrypoints:
  human: README.md
  agent: AGENTS.md

imports:
  - kind: local
    path: patterns/knowledge-base-kit  # a git submodule at a release tag
    relationship: foundational
    sync_policy: extend

paths:
  docs: docs

sources:
  canonical:
    - path: lib/**
      note: "tuteur's behaviour is defined by its code and tests/run.sh"
    - path: template/**
      note: "The workflows consumers must match"
  interpretation:
    - path: README.md
      note: "Orientation"
    - path: docs/**
      note: "Explains the code; reference pages cite it in a Sources section"
    - path: contracts/**
      note: "tuteur's contracts (status/1); each cites the code in a Sources section"

rules:
  lifecycle:
    statuses: [draft, working, stable, deprecated]
  checks:
    links:
      include: [README.md, AGENTS.md, CHANGELOG.md, docs/**, contracts/**]
    lifecycle:
      include: [docs/**, contracts/**]
    provenance:
      include: [docs/reference/**, contracts/**]
  writes:
    allow: ["docs/**", "lib/**", "tests/**", "template/**", "dev/**", "contracts/**"]
    # patterns/** is ask-first, so it is in neither list (knowledge-base-kit v2.1.0 has allow and deny only): a
    # pattern is another repository, and an edit there is a change to that provider, made on a branch in the
    # pattern and upstreamed (docs/guides/fix-a-provider.md). Ask before editing it.
